[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergraph-evaluation"
version = "2.0.1"
description = "Synthetic data generation, extraction and F1 evaluation for the Temporal Hypergraph Engine"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
urls = { Homepage = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Repository = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Documentation = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine/blob/main/docs/05-extraction-benchmarks.txt" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.17",
    "openai>=1.55",
    "httpx>=0.27",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["networkx>=3.2", "faiss-cpu>=1.8", "sentence-transformers>=3.0,<3.5", "tiktoken>=0.7", "qdrant-client>=1.10"]

[tool.setuptools]
packages = ["hypergraph_evaluation", "hypergraph_evaluation.schema"]

[tool.setuptools.package-dir]
hypergraph_evaluation = "."

[tool.setuptools.package-data]
"hypergraph_evaluation.schema" = ["*.json"]
