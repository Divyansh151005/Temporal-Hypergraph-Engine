[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergraph-offloader"
version = "0.1.0"
description = "vLLM KV-cache secondary storage tier backed by the Temporal Hypergraph Engine"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "hypergraph-engine-native",
]

[tool.setuptools]
packages = ["hypergraph_offloader"]
