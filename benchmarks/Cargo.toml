[package]
name = "thg-benchmarks"
description = "Extreme-scale ingest and lock-free concurrency benchmarks for the Temporal Hypergraph Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "thg_benchmarks"
path = "bench_support.rs"
bench = false

[dependencies]
engine-core.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rand.workspace = true
tempfile.workspace = true
hdrhistogram = { version = "7", default-features = false }
memory-stats = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "scale_stress"
path = "scale_stress.rs"
harness = false

[[bench]]
name = "concurrency_scaling"
path = "concurrency_scaling.rs"
harness = false
