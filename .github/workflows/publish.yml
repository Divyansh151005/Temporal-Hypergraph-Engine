# Publishes the SDKs and the server image when a GitHub Release is published.
#
# A manual run (workflow_dispatch) publishes only the pure-Python packages and
# the Docker image; the native wheels and the npm SDK are release-only, because
# PyPI and npm reject re-uploads of an existing version.
#
# One-time setup:
#   - PyPI: add a (pending) Trusted Publisher for each of
#     `hypergraph-engine-native`, `hypergraph-client`, `langchain-hypergraph`,
#     `llama-index-hypergraph` and `hypergraph-offloader`, with owner
#     `Divyansh151005`, repository `Temporal-Hypergraph-Engine`, workflow
#     `publish.yml` and environment `pypi`. No PyPI token is stored.
#   - npm: create the `@temporal-hypergraph` scope, then add an automation or
#     granular token that can publish to it as the `NPM_TOKEN` secret.
#   - GitHub: create the `pypi` and `npm` environments (add reviewers there to
#     gate releases).
#   - GHCR: after the first push, set the `temporal-hypergraph-server` package
#     visibility to Public; packages from a private repository start private.
#
# Rust crates are published by hand; see docs/publishing-crates.md.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MATURIN_DIR: crates/pyo3-bindings
  # Must stay within the CPython range supported by the pinned PyO3 (0.22:
  # up to 3.13). Runners ship newer interpreters, so --find-interpreter breaks.
  PYTHON_INTERPRETERS: python3.10 python3.11 python3.12 python3.13

jobs:
  linux:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ${{ env.MATURIN_DIR }}/dist

  windows:
    # Windows interpreters are not exposed as pythonX.Y, so build one
    # version per job against the `python` that setup-python puts on PATH.
    if: github.event_name == 'release'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}-py${{ matrix.python }}
          path: ${{ env.MATURIN_DIR }}/dist

  macos:
    # Apple silicon runner; x86_64 is cross-compiled against the universal2
    # interpreters installed by setup-python.
    if: github.event_name == 'release'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ${{ env.MATURIN_DIR }}/dist

  sdist:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag matches the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: ${{ env.MATURIN_DIR }}/dist

  publish-pypi:
    if: github.event_name == 'release'
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypergraph-engine-native
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  python-sdks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hypergraph-client
            dir: integrations/python-client
          - name: langchain-hypergraph
            dir: integrations/langchain
          - name: llama-index-hypergraph
            dir: integrations/llamaindex
          - name: hypergraph-offloader
            dir: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "${{ matrix.dir }}/pyproject.toml")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match ${{ matrix.name }} version $version"
            exit 1
          fi
      - run: pipx run build --sdist --wheel "${{ matrix.dir }}" --outdir dist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-${{ matrix.name }}
          path: dist

  publish-python-sdks:
    needs: [python-sdks]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypergraph-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-sdk-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/divyansh151005/temporal-hypergraph-server
    steps:
      - uses: actions/checkout@v4
      - name: Read the workspace version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=SSPL-1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@temporal-hypergraph/sdk
    defaults:
      run:
        working-directory: integrations/vercel-ai-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: integrations/vercel-ai-sdk/.nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: integrations/vercel-ai-sdk/package-lock.json
      - name: Check release tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Scoped packages default to restricted access. Add --provenance (and
      # id-token: write) once the repository is public; npm rejects it for
      # private source repositories.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
