[workspace]
resolver = "2"
members = [
    "crates/temporal-math",
    "crates/engine-core",
    "crates/vllm-kv-store",
    "crates/grpc-server",
    "crates/pyo3-bindings",
    "benchmarks",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine"
homepage = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine"
readme = "README.md"
keywords = ["hypergraph", "temporal", "rag", "vllm", "database"]
categories = ["database-implementations", "data-structures", "science"]
rust-version = "1.80"

[workspace.dependencies]
temporal-math = { version = "1.0.0", path = "crates/temporal-math" }
engine-core = { version = "1.0.0", path = "crates/engine-core" }
vllm-kv-store = { version = "1.0.0", path = "crates/vllm-kv-store" }

arc-swap = "1.7"
blake3 = { version = "1.5", features = ["rayon"] }
bytes = "1"
prost = "0.13"
protoc-bin-vendored = "3"
pyo3 = "0.22"
rayon = "1.10"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
tower = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1.16", features = ["derive"] }
crc32fast = "1.4"
crossbeam-channel = "0.5"
crossbeam-skiplist = "0.1"
dashmap = "6"
memmap2 = "0.9"
parking_lot = "0.12"
smallvec = { version = "1.13", features = ["const_generics", "union"] }
thiserror = "1"
tracing = "0.1"
wide = "0.7"
loom = "0.7"

# dev
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
rand = { version = "0.8", features = ["small_rng"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = 1
