[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-hypergraph"
version = "1.0.1"
description = "LangChain chat memory and vector store backed by the Temporal Hypergraph Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
urls = { Homepage = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Repository = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Documentation = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine/tree/main/integrations/langchain" }
dependencies = [
    "hypergraph-client>=1.0.1",
    "langchain-core>=0.3",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_hypergraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
