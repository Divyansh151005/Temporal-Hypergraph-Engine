[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-hypergraph"
version = "2.0.1"
description = "LangChain chat memory and vector store on the Temporal Hypergraph Engine: time-aware multi-hop context with zero stale facts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
keywords = ["langchain", "hypergraph", "temporal-graph", "graph-database", "rag", "llm-memory", "vector-store"]
urls = { Homepage = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Repository = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine", Documentation = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine/tree/main/integrations/langchain", Issues = "https://github.com/Divyansh151005/Temporal-Hypergraph-Engine/issues" }
dependencies = [
    "hypergraph-client>=2.0.0,<3",
    "langchain-core>=0.3",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_hypergraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
