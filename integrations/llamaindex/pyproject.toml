[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-hypergraph"
version = "0.1.0"
description = "LlamaIndex retriever and chat memory backed by the Temporal Hypergraph Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "hypergraph-client>=0.1.0",
    "llama-index-core>=0.14",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llama_index_hypergraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
